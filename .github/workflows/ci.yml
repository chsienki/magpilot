name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Magpilot.slnx

      - name: Build
        run: dotnet build Magpilot.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Magpilot.slnx -c Release --no-build
