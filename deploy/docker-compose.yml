# Example hub deployment for a Linux Docker host.
# Host networking allows LAN discovery on UDP 47823 and pairing on UDP 47824.
# Put HTTPS in front of TCP 7088 and configure the real trusted proxy peers.
# See README.md for the sibling .env, OAuth, pairing, and backup requirements.
#
# Start the hub: docker compose up -d hub
# Optional automatic updates: docker compose up -d watchtower
# Pin the image tag or digest for controlled rollout and rollback.

services:
  hub:
    image: ghcr.io/chsienki/magpilot-hub:latest
    container_name: magpilot-hub
    restart: unless-stopped
    network_mode: host
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:7088
      ASPNETCORE_ENVIRONMENT: Production
      MAGPILOT_HUB_DATA: /data
      MAGPILOT_HUB_BEARER: ${MAGPILOT_HUB_BEARER:?set MAGPILOT_HUB_BEARER in .env}
      MAGPILOT_HUB_COOKIE_DOMAIN: ${MAGPILOT_HUB_COOKIE_DOMAIN:-}
      MAGPILOT_HUB_TRUSTED_PROXIES: ${MAGPILOT_HUB_TRUSTED_PROXIES:-127.0.0.1,::1}
      MAGPILOT_HUB_PUBLIC_URL: ${MAGPILOT_HUB_PUBLIC_URL:-}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_ALLOWED_GITHUB_USERS: ${OAUTH_ALLOWED_GITHUB_USERS:-}
      MAGPILOT_DEV_BYPASS_AUTH: ${MAGPILOT_DEV_BYPASS_AUTH:-}
    volumes:
      - ./data:/data

  # Watches only labeled containers and updates the digest of their chosen tag.
  # The Docker socket grants this helper broad control of the Docker host.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: magpilot-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      # Its bundled client's default API version is rejected by newer daemons.
      DOCKER_API_VERSION: "1.41"
      TZ: ${TZ:-UTC}
